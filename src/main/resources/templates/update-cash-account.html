<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{elements.html :: head('Update Cash Account')}">
</head>

<body>
<div th:replace="~{elements.html :: navbar}"></div>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">

      <!-- Navigation / Back link -->
      <div class="mb-3 d-flex justify-content-between">
        <a th:href="@{/accounts}" class="text-decoration-none text-muted">
          <i class="bi bi-arrow-left"></i> Back to Accounts
        </a>
        <a th:href="@{/accounts/{id}/transactions(id=${account.id})}" class="text-decoration-none text-muted">
          <i class="bi bi-clock-history"></i> Transaction History
        </a>
      </div>

      <div class="card card-custom p-4 p-md-5">
        <div class="d-flex align-items-center mb-4">
          <div class="bg-primary text-white rounded-3 p-3 me-3">
            <i class="bi bi-cash-coin fs-3"></i>
          </div>
          <div>
            <h3 class="mb-1 fw-bold" th:text="${account.name}">Account Name</h3>
            <p class="text-muted mb-0">
              <span class="fw-semibold" th:text="|${account.balance} ${account.currency}|">0.00 USD</span>
              &middot;
              <span th:text="${account.status}">ACTIVE</span>
              &middot; opened <span th:text="${account.startDate}">2026-01-01</span>
            </p>
          </div>
        </div>

        <!-- Flash error set by CashAccountController after a failed update -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}">Error</span>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="@{/cash-accounts/{id}/update(id=${account.id})}" method="post">

          <div class="row g-3">
            <!-- Operation -->
            <div class="col-md-6">
              <label for="operation" class="form-label">Operation</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-arrow-left-right"></i></span>
                <select id="operation" name="operation" class="form-select">
                  <option value="">No transaction</option>
                  <option value="DEPOSIT">Deposit (add funds)</option>
                  <option value="WITHDRAW">Withdraw (remove funds)</option>
                </select>
              </div>
              <div class="form-text">Pick an operation and enter the amount below.</div>
            </div>

            <!-- Amount -->
            <div class="col-md-6">
              <label for="amount" class="form-label">Amount</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-cash-stack"></i></span>
                <input type="number"
                       step="0.01"
                       min="0.01"
                       id="amount"
                       name="amount"
                       class="form-control"
                       placeholder="0.00">
              </div>
              <div class="form-text" th:text="|Available balance: ${account.balance} ${account.currency}|">Available balance: 0.00 USD</div>
            </div>

            <!-- Status -->
            <div class="col-md-6">
              <label for="status" class="form-label">Account Status</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-activity"></i></span>
                <select id="status" name="status" class="form-select">
                  <option th:each="s : ${T(com.dnu.sfm.model.AccountStatus).values()}"
                          th:value="${s}"
                          th:text="${s}"
                          th:selected="${s == account.status}">ACTIVE</option>
                </select>
              </div>
              <div class="form-text">Transactions are only possible while the status is ACTIVE.</div>
            </div>
          </div>

          <hr class="my-4">

          <!-- Actions -->
          <div class="d-flex justify-content-end gap-2">
            <a th:href="@{/accounts}" class="btn btn-outline-secondary px-4">Cancel</a>
            <button type="submit" class="btn btn-primary px-4 fw-semibold">
              <i class="bi bi-check2-circle me-1"></i> Apply Changes
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

<footer th:replace="elements.html :: footer"></footer>

</body>
</html>
