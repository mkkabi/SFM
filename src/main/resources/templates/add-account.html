<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{elements.html :: head('Add account')}">

  <style>

  </style>
</head>

<body>
<div th:replace="~{elements.html :: navbar}"></div>


<div class="container-fluid">

  <h2>Create New Group</h2>
  <!-- Wrapper whose background you can change -->
  <div class="piggy-stage" id="piggyStage">
    <svg class="piggy-svg" id="piggySvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">

      <!-- Coin -->
      <g class="coin">
        <circle cx="100" cy="50" r="14" fill="#FACC15" stroke="#CA8A04" stroke-width="2.5" />
        <circle cx="100" cy="50" r="10" fill="none" stroke="#EAB308" stroke-width="1.5" stroke-dasharray="3 2" />
        <text x="100" y="55" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#A16207" text-anchor="middle">$</text>
      </g>

      <!-- Piggy Bank Body -->
      <g class="pig-body-group">
        <!-- Tail -->
        <path class="tail" d="M 38 120 C 22 122, 18 106, 26 102 C 34 98, 30 114, 20 112"
              fill="none" stroke="#F472B6" stroke-width="3.5" stroke-linecap="round" />

        <!-- Back Legs -->
        <rect x="52" y="145" width="16" height="20" rx="8" fill="#EC4899" />
        <rect x="132" y="145" width="16" height="20" rx="8" fill="#EC4899" />

        <!-- Front Legs -->
        <rect x="68" y="148" width="16" height="20" rx="8" fill="#F472B6" />
        <rect x="116" y="148" width="16" height="20" rx="8" fill="#F472B6" />

        <!-- Torso -->
        <ellipse cx="100" cy="115" rx="66" ry="52" fill="#F472B6" />

        <!-- Ears -->
        <polygon points="128,78 140,52 148,74" fill="#EC4899" />
        <polygon points="138,82 152,56 160,80" fill="#F472B6" />
        <polygon points="142,80 151,63 156,79" fill="#FBCFE8" />

        <!-- Coin Slot -->
        <ellipse cx="100" cy="65" rx="14" ry="3" fill="#BE185D" />

        <!-- Snout -->
        <ellipse cx="166" cy="116" rx="15" ry="20" fill="#F9A8D4" stroke="#F472B6" stroke-width="2" />
        <ellipse cx="166" cy="111" rx="2.5" ry="4" fill="#BE185D" />
        <ellipse cx="166" cy="121" rx="2.5" ry="4" fill="#BE185D" />

        <!-- Eye & Cheeks -->
        <circle cx="138" cy="98" r="4" fill="#1E293B" />
        <circle cx="139.5" cy="96.5" r="1.5" fill="#FFFFFF" />
        <ellipse cx="132" cy="118" rx="7" ry="4" fill="#FB7185" opacity="0.4" />
      </g>
    </svg>
  </div>
  <form class="form-horizontal col-8" >

    <div class="form-group row">
      <label class="col-sm-2 col-form-label" for="admittanceYear">Admittance Year</label>
      <input type="number" class="form-control col-sm-6" id="admittanceYear" placeholder="Only numbers allowed"
      />
      <small class="form-text text-muted"  ></small>
    </div>

    <div class="form-group row">
      <label class="col-sm-2 col-form-label" for="courseNumber">Course Number</label>
      <input type="number" class="form-control col-sm-6" id="courseNumber" placeholder="Only numbers allowed"/>
      <small class="form-text text-muted" ></small>
    </div>

    <div class="form-group row">
      <label class="col-sm-2 col-form-label" for="groupNumber">Group Number</label>
      <input type="text" class="form-control col-sm-6" id="groupNumber" placeholder="Text"/>
      <small class="form-text text-muted"></small>
    </div>

    <div class="form-group row">
      <label class="col-sm-2 col-form-label" for="alternativeName">Alternative Group Name</label>
      <input type="text" class="form-control col-sm-6" id="alternativeName"/>
    </div>


    <div class="form-group row">
      <label class="col-sm-2 col-form-label" for="sessionStart">Session Start:</label>
      <input type="date" class="col-sm-6 form-control"
             id="sessionStart"/>

    </div>


    <div class="form-group row">
      <label class="col-sm-2 col-form-label" for="sessionEnd">Session End:</label>
      <input type="date" class="col-sm-6 form-control"
             id="sessionEnd"/>

    </div>

    <div class="form-group row">
      <label class="col-sm-2 col-form-label" for="educationForm_id">Education Form:</label>
      <select class="form-control col-sm-6" id="educationForm_id" name="educationForm_id">

      </select>
    </div>



    <div>
      <input type="submit" class="btn btn-info" value="Register" onclick="triggerPiggyBank()"/>
      <input type="reset" class="btn btn" value="Clear" onclick="triggerPiggyBank()"/>

      <div class="demo-controls">

      </div>
    </div>
  </form>
</div>
<br/><br/><br/>

<footer th:replace="elements.html :: footer"></footer>


  <script>
    const stage = document.getElementById('piggyStage');
    const svg = document.getElementById('piggySvg');

    /**
     * Call this function whenever your event fires:
     * (e.g., successful payment, points gained, button clicked, form saved)
     */
    function triggerPiggyBank() {
      // Prevent re-triggering while animation is currently playing
      if (stage.classList.contains('is-active')) return;

      // Add the active class to play the animations
      stage.classList.add('is-active');

      // Automatically reset when the 2-second animation concludes
      svg.addEventListener('animationend', function handleEnd(e) {
        // Ensure we listen specifically for the main container animation finishing
        if (e.animationName === 'svgLifecycle') {
          stage.classList.remove('is-active');
          svg.removeEventListener('animationend', handleEnd);
        }
      });
    }

    /**
     * Demo helper: Shows that the background can be changed dynamically
     */
    function toggleBackground() {
      const colors = ['transparent', '#e0f2fe', '#fef3c7', '#dcfce7', '#1e293b'];
      const currentColor = stage.style.backgroundColor || 'transparent';
      const nextIndex = (colors.indexOf(currentColor) + 1) % colors.length;
      stage.style.backgroundColor = colors[nextIndex];
    }
  </script>
</body>
</html>
