<body>
<div th:replace="~{elements.html :: navbar}"></div>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">

      <!-- Navigation / Back link -->
      <div class="mb-3">
        <a th:href="@{/accounts}" class="text-decoration-none text-muted">
          <i class="bi bi-arrow-left"></i> Back to Accounts
        </a>
      </div>

      <div class="card card-custom p-4 p-md-5">
        <div class="d-flex align-items-center mb-4">
          <div class="bg-primary text-white rounded-3 p-3 me-3">
            <i class="bi bi-wallet2 fs-3"></i>
          </div>
          <div>
            <h3 class="mb-1 fw-bold">Create New Account</h3>
            <p class="text-muted mb-0">Set up a new banking, savings, or investment account.</p>
          </div>
        </div>

        <!-- Form with th:object -->
        <form th:action="@{/accounts/new}" th:object="${account}" method="post" novalidate>

          <!-- Global validation error alert (inside form context) -->
          <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Validation error</div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>

          <div class="row g-3">
            <!-- Account Name -->
            <div class="col-md-6">
              <label for="accountName" class="form-label">Account Name <span class="text-danger">*</span></label>
              <input type="text"
                     id="accountName"
                     th:field="*{name}"
                     class="form-control"
                     th:errorclass="is-invalid"
                     placeholder="e.g. Main Checking, Emergency Fund"
                     required>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                Please provide an account name.
              </div>
            </div>

            <!-- Account Number / Identifier -->
            <div class="col-md-6">
              <label for="accountNumber" class="form-label">Account Number / IBAN</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-hash"></i></span>
                <input type="text"
                       id="accountNumber"
                       th:field="*{accountNumber}"
                       class="form-control"
                       th:errorclass="is-invalid">
              </div>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('accountNumber')}" th:errors="*{accountNumber}">
                Invalid account number.
              </div>
            </div>

            <!-- Account Type -->
            <div class="col-md-6">
              <label for="accountType" class="form-label">Account Type <span class="text-danger">*</span></label>
              <select id="accountType"
                      th:field="*{accountType}"
                      class="form-select"
                      th:errorclass="is-invalid"
                      required>
                <option value="" disabled selected>Select account type</option>
<!--                <option value="CHECKING">Checking / Everyday</option>-->
<!--                <option value="SAVINGS">Savings Account</option>-->
<!--                <option value="CREDIT_CARD">Credit Card</option>-->
<!--                <option value="INVESTMENT">Investment / Brokerage</option>-->
                <option value="CASH">Cash / Wallet</option>
              </select>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('accountType')}" th:errors="*{accountType}">
                Please select an account type.
              </div>
            </div>

            <!-- Currency -->
            <div class="col-md-6">
              <label for="currency" class="form-label">Currency <span class="text-danger">*</span></label>
              <select id="currency"
                      th:field="*{currency}"
                      class="form-select"
                      th:errorclass="is-invalid"
                      required>
                <option value="USD">USD - US Dollar ($)</option>
                <option value="EUR">EUR - Euro (€)</option>
                <option value="GBP">GBP - British Pound (£)</option>
                <option value="UAH">UAH - Ukrainian Hryvnia (₴)</option>
                <option value="PLN">PLN - Polish Złoty (zł)</option>
              </select>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('currency')}" th:errors="*{currency}">
                Please choose a currency.
              </div>
            </div>

            <!-- Initial Balance -->
            <div class="col-md-6">
              <label for="initialBalance" class="form-label">Opening Balance <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-cash-stack"></i></span>
                <input type="number"
                       step="0.01"
                       id="initialBalance"
                       th:field="*{initialBalance}"
                       class="form-control"
                       th:errorclass="is-invalid"
                       placeholder="0.00"
                       required>
              </div>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('initialBalance')}" th:errors="*{initialBalance}">
                Please specify a valid starting balance.
              </div>
            </div>

            <!-- Institution / Bank Name -->
            <div class="col-md-6">
              <label for="institution" class="form-label">Bank Name</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-bank"></i></span>
                <input type="text"
                       id="institution"
                       th:field="*{institution}"
                       class="form-control"
                       th:errorclass="is-invalid">
              </div>
            </div>

            <!-- Description / Notes -->
            <div class="col-12">
              <label for="description" class="form-label">Notes & Description</label>
              <textarea id="description"
                        th:field="*{description}"
                        class="form-control"
                        rows="3"
                        placeholder="Optional notes or details regarding this account..."></textarea>
            </div>
          </div>

          <hr class="my-4">

          <!-- Actions -->
          <div class="d-flex justify-content-end gap-2">
            <a th:href="@{/accounts}" class="btn btn-outline-secondary px-4">Cancel</a>
            <button type="submit" class="btn btn-primary px-4 fw-semibold">
              <i class="bi bi-check2-circle me-1"></i> Save Account
            </button>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>

<!--<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>-->
<footer th:replace="elements.html :: footer"></footer>

</body>
</html>
