<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{elements.html :: head('All Accounts - SFM')}">
</head>

<body>

<div th:replace="~{elements.html :: navbar}"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10 col-md-11">

            <!-- Flash message set by CashAccountController after successful creation -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card card-custom p-4 p-md-5">
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary text-white rounded-3 p-3 me-3">
                            <i class="bi bi-bank2 fs-3"></i>
                        </div>
                        <div>
                            <h3 class="mb-1 fw-bold">All Accounts</h3>
                            <p class="text-muted mb-0" th:text="|${#lists.size(accounts)} account(s) found|">0 account(s) found</p>
                        </div>
                    </div>
                    <a th:href="@{/cash-accounts/new}" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i> New Account
                    </a>
                </div>

                <!-- Empty state -->
                <div th:if="${#lists.isEmpty(accounts)}" class="text-center py-5">
                    <i class="bi bi-inbox fs-1 text-muted"></i>
                    <h5 class="mt-3 text-muted">No accounts yet</h5>
                    <p class="text-muted">Create your first account to start tracking your finances.</p>
                    <a th:href="@{/cash-accounts/new}" class="btn btn-outline-primary">
                        <i class="bi bi-plus-lg me-1"></i> Create Account
                    </a>
                </div>

                <!-- Accounts table -->
                <div th:if="${!#lists.isEmpty(accounts)}" class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th scope="col">Name</th>
                            <th scope="col">Opened</th>
                            <th scope="col">Type</th>
                            <th scope="col" class="text-end">Balance</th>
                            <th scope="col" class="text-center">Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="account : ${accounts}">
                            <td class="fw-semibold" th:text="${account.name}">Account Name</td>
                            <td th:text="${account.startDate}">2026-01-01</td>
                            <td>
                <span th:if="${account instanceof T(com.dnu.sfm.model.DepositAccount)}"
                      class="badge text-bg-info">Deposit</span>
                                <span th:unless="${account instanceof T(com.dnu.sfm.model.DepositAccount)}"
                                      class="badge text-bg-light text-dark border">Cash / Bank</span>
                            </td>
                            <td class="text-end font-monospace"
                                th:text="|${account.balance} ${account.currency}|">0.00 USD</td>
                            <td class="text-center">
                                <span th:if="${account.status.name() == 'ACTIVE'}" class="badge text-bg-success">Active</span>
                                <span th:if="${account.status.name() == 'FROZEN'}" class="badge text-bg-warning">Frozen</span>
                                <span th:if="${account.status.name() == 'CLOSED'}" class="badge text-bg-secondary">Closed</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="mt-3">
                <a th:href="@{/home}" class="text-decoration-none text-muted">
                    <i class="bi bi-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </div>
</div>

<!--<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>-->

<footer th:replace="elements.html :: footer"></footer>
</body>
</html>
