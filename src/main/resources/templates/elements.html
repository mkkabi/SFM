<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:fragment="head(title)">
    <meta http-equiv="Content Type" content="text/html; charset=UTF-8"></meta>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0"></meta>
    <title th:text="${title}"></title>

    <!--    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>-->
    <!--    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>-->

    <link rel="stylesheet" th:href="@{/css/main.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}"  type="text/css">
    <script th:src="@{/js/bootstrap.bundle.min.js}" type="text/javascript" ></script>

</head>

<body>

<div class="container-fluid">
    <div th:fragment="navbar">


        <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: rgb(53 113 201)">

            <div class="container-fluid">
                <a class="navbar-brand" th:href="@{/}">
                    <img th:src="@{/images/logo.png}"/>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">

                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                        <li class="nav-item">
                            <a th:href="@{/}" class="nav-link active" aria-current="page">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Link</a>
                        </li>

                        <li class="nav-item dropdown">
                            <a th:href="@{#}" class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                Accounts
                            </a>

                            <ul class="dropdown-menu" >
                                <li><a th:href="@{/accounts}" class="dropdown-item" >All Accounts</a></li>
                                <li><a th:href="@{/cash-accounts/new}" class="dropdown-item" >Add Cash Account</a></li>
                                <li><a th:href="@{/deposit-accounts/new}" class="dropdown-item" >Add Deposit Account</a></li>
                            </ul>

                        </li>

                        <li class="nav-item">
                            <a class="nav-link disabled">Disabled</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <br>
        <br>
<!--        <div class="alert alert-success text-center" th:if="${message != null}">[[${message}]]-->
<!--        </div>-->
<!--        <div class="alert alert-danger text-center" th:if="${warning!=null &&#strings.length(warning)>0}">[[${warning}]]-->
<!--        </div>-->

    </div>


    <footer th:fragment="footer" class="text-center text-white" style="background-color: rgb(53 113 201)">
        <div class="text-center p-3">
            © 2026 Copyright: SFM
        </div>
    </footer>

</div>
</body>
</html>
