spring.application.name=sfm

# DataSource Configuration
spring.datasource.url=jdbc:sqlite:finance_app.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# HikariCP Tuning for SQLite
# SQLite allows only one writer at a time; a large connection pool causes SQLITE_BUSY errors
spring.datasource.hikari.maximum-pool-size=1

# Hibernate Dialect Configuration (Hibernate 6+)
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
# Optional: enable SQL logging to see table creation statements on startup
spring.jpa.show-sql=true

