spring.application.name=sfm

# DataSource Configuration
spring.datasource.url=jdbc:sqlite:finance_app.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# HikariCP Tuning for SQLite
# SQLite allows only one writer at a time; a large connection pool causes SQLITE_BUSY errors
spring.datasource.hikari.maximum-pool-size=1

# Hibernate Dialect Configuration (Hibernate 6+)
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
#spring.jpa.database-platform=org.hibernate.dialect.SQLiteDialect

spring.jpa.hibernate.ddl-auto=update
# Optional: enable SQL logging to see table creation statements on startup
spring.jpa.show-sql=true

# World Bank API Configuration (annual consumer price inflation)
worldbank.api.base-url=https://api.worldbank.org/v2
worldbank.api.indicator-code=FP.CPI.TOTL.ZG

# StatBureau API Configuration (monthly history + annual consumer price inflation)
statbureau.api.base-url=https://www.statbureau.org
# Annual figures are calculated over the Jan 1 -> Dec 1 window of the requested year
statbureau.api.yearly-path=/calculate-inflation-rate-json

